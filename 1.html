<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Reverser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* TO DO: Replace with favourite color */
      background: #449c9c;
    }
    img { margin-bottom: 1rem; }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center;}
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { border-color: #4a90d9; outline: none; }
    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #357abd; }
    .result {
      margin-top: 1rem;
      margin-top: 1rem;
      padding: 0.75rem;
      padding: 0.75rem;
      background: #f8fafc;
      background: #f8fafc;
      border-radius: 8px;
      border-radius: 8px;
      font-size: 1rem;
      font-size: 1rem;
      word-break: break-all;
      min-height: 1.5rem;
      min-height: 1.5rem;
      display: block;
    }
    .result img {
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }
    .farkled-text {
      color: #449c9c;
      font-weight: 1000;
    }
    .dice-section {
      background: #2a6e6e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .music-button {
      max-width: 200px;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
    .poem {
        max-width: 100%;
        height: auto;
        margin-top: 2rem;
        margin-bottom: 2rem;
    }
  </style>
</head>
<body>
    <button onclick="replayAudio()" class="music-button">Click (if audio doesn't play)</button>
    <audio id="background-audio">
    <source src="poem.mp3" type="audio/mpeg">
  </audio>
  <img class="poem" src="poem.png">
  <div class="dice-section">
    <h1>A Birthday Poem written just for you!<h1>
    <button class="music-button" onclick="replayAudio()">Click to hear again</button>
  </div>
  <a class="button" href="index.html">Click to go back, and roll again</a>

  <script>
      // ===== Audio Autoplay Logic WITH HIGHER VOLUME =====
  const audio = document.getElementById('background-audio');
  audio.volume = 1.0;

    let played = false;
    function playAudio() {
      if (!played) {
        audio.volume = 1.0; 
        audio.play().catch(()=>{});
        played = true;
      }
    }
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, playAudio, {once: true});
    });

    setTimeout(playAudio, 1000);
    
    function replayAudio() {
        audio.currentTime = 0;   // rewind to start
        audio.volume = 1.0;
        audio.play().catch(()=>{});
}   
  </script>
</body>
</html>
