<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Reverser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* TO DO: Replace with favourite color */
      background: #449c9c;
    }
    img { margin-bottom: 1rem; }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center;}
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { border-color: #4a90d9; outline: none; }
    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #357abd; }
    .result {
      margin-top: 1rem;
      margin-top: 1rem;
      padding: 0.75rem;
      padding: 0.75rem;
      background: #f8fafc;
      background: #f8fafc;
      border-radius: 8px;
      border-radius: 8px;
      font-size: 1rem;
      font-size: 1rem;
      word-break: break-all;
      min-height: 1.5rem;
      min-height: 1.5rem;
      display: block;
    }
    .result img {
      display: block;
      margin: 0 auto;
      cursor: pointer;
    }
    .farkled-text {
      color: #0e3d3d;
      font-weight: 1000;
    }
    .dice-section {
      background: #2a6e6e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .music-button {
      max-width: 200px;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
    .image {
        border-radius: 20px;
        width: 50%;
        display: grid;
        box-shadow: 5px 5px 10px 2px rgb(0 0 0 / 0.8);
    }
  </style>
</head>
<body>
  <img class="image" src="main.png">
  <button onclick="replayAudio()" class="music-button">Click (if audio doesn't play)</button>
  <h1>Click on the button above, wait for the song to end, then take your chance and roll, but don't worry, you won't Farkle...</h1>
  <audio id="background-audio" loop>
    <source src="onJoin.mp3" type="audio/mpeg">
  </audio>
  <br>
  <br>
  <div class="dice-section">
    <h1><h1>
    <button class="roll-the-dice" onclick="diceRoll()">Click me, then click the die</button>
    <div class="result">
      <video id="diceVideo" style="display:none; max-width:100%; margin:0 auto;" muted playsinline>
        <source src="dice-roll.mp4" type="video/mp4">
      </video>
      <a id="imageLink" href="#" style="display:block; text-align:center;">
        <img id="myImage" src="" alt="Dice result" style="display:none;">
      </a>
      <p id="result" style="text-align:center; margin-top:0.5rem; font-size:0.9rem; word-break:break-all;"></p>
    </div>   
  </div>

  <script>
      // ===== Audio Autoplay Logic WITH HIGHER VOLUME =====
  const audio = document.getElementById('background-audio');
  audio.volume = 1.0;

    let played = false;
    function playAudio() {
      if (!played) {
        audio.volume = 1.0; 
        audio.play().catch(()=>{});
        played = true;
      }
    }
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, playAudio, {once: true});
    });

    setTimeout(playAudio, 1000);
    function replayAudio() {
      audio.currentTime = 0;   // rewind to start
      audio.volume = 1.0;
      audio.play().catch(()=>{});
}   
// ===== Dice Roll =====
  // 1. Define the images associated with numbers 1-6
const images = ["1.png", "2.png", "3.png", "4.png", "5.png", "6.png"];
const links = [
  "1.html",
  "2.html",
  "3.html",
  "4.html",
  "5.html",
  "6.html"
];

function diceRoll() {
  const video = document.getElementById("diceVideo");
  const img = document.getElementById("myImage");
  const link = document.getElementById("imageLink");
  const result = document.getElementById("result");

  img.style.display = "none";
  result.textContent = "";

  video.style.display = "block";
  video.currentTime = 0;
  video.play();

  video.onended = () => {
    video.style.display = "none";

    const randomNum = Math.floor(Math.random() * images.length);

    img.src = images[randomNum];
    link.href = links[randomNum];
    img.style.display = "block";
    result.textContent = links[randomNum];
  };
}    
  </script>
</body>
</html>
