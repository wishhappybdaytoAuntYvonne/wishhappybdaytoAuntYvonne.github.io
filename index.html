<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Reverser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      /* TO DO: Replace with favourite color */
      background: #449c9c;
    }
    img { margin-bottom: 1rem; }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; text-align: center;}
    input[type="text"] {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 0.75rem;
    }
    input[type="text"]:focus { border-color: #4a90d9; outline: none; }
    button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #357abd; }
    .result {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f8fafc;
      border-radius: 8px;
      font-size: 1rem;
      word-break: break-all;
      min-height: 1.5rem;
    }
    .farkled-text {
      color: #449c9c;
      font-weight: 1000;
    }
    .dice-section {
      background: #2a6e6e;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 480px;
      margin-bottom: 2rem;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    .roll-the-dice {
      
    }
    .music-button {
      max-width: 200px;
      margin-top: 2rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <button class="music-button">Click</button>
  <audio id="background-audio" loop>
    <source src="onJoin.mp3" type="audio/mpeg">
  </audio>
  <div class="dice-section">
    <h1>Take your chance and roll...<h1>
    <input type="text" id="input" placeholder="Type something here…">
    <button class="roll-the-dice" onclick="diceRoll()">Roll the dice</button>
    <div class="result" id="myImage"></div>
  </div>

    <input type="text" id="input" placeholder="Type something here…">
    <button onclick="reverse()">Reverse</button>

    <button onclick="reverse()">Reverse</button>
    <div class="result" id="output"></div>

  <script>
      // ===== Audio Autoplay Logic WITH HIGHER VOLUME =====
  const audio = document.getElementById('background-audio');
  audio.volume = 1.0; // set to max volume (1.0 is highest possible)

    let played = false;
    function playAudio() {
      if (!played) {
        audio.volume = 1.0; // re-apply max volume when playing just in case
        audio.play().catch(()=>{});
        played = true;
      }
    }
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, playAudio, {once: true});
    });

    setTimeout(playAudio, 1000);

    function diceRoll() {
      // 1. Define the images associated with numbers 1-6
      const images = [
       "1.png", // Corresponds to 1
       "2.png", // Corresponds to 2
       "3.png", // Corresponds to 3
       "4.png", // Corresponds to 4
       "5.png", // Corresponds to 5
       "6.png"  // Corresponds to 6
      ];

      // 2. Generate a random number between 1 and 6
      const randomNum = Math.floor(Math.random() * 6) + 1;

      // 3. Select the image (subtract 1 because arrays are 0-indexed)
      const selectedImage = images[randomNum - 1];

      // 4. Apply the image to your HTML element
      document.getElementById("myImage").src = selectedImage; 
    }
  </script>
</body>
</html>
